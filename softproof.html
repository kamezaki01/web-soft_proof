<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ソフトプルーフ</title>
<style>
:root{
  --bar:#dcdcdc; --line:#b4b4b4; --text:#1c1c1c; --muted:#5a5a5a;
  --view:#808080; --btn:#ebebeb; --btn-hover:#f5f5f5; --on:#2a2a2a; --on-text:#f2f2f2;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:auto 1fr auto;background:var(--view);color:var(--text);
  font:13px/1.3 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}

/* toolbar */
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 8px;background:var(--bar);border-bottom:1px solid var(--line);min-height:40px}
.grp{display:flex;align-items:center;gap:4px}
.sep{width:1px;align-self:stretch;margin:2px 4px;background:var(--line)}
.sp{flex:1}
.b{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:var(--btn);cursor:pointer;white-space:nowrap}
.b:hover{background:var(--btn-hover)}
.b[aria-pressed="true"]{background:var(--on);color:var(--on-text);border-color:var(--on)}
.b:disabled{opacity:.45;cursor:default}
.b.ic{width:30px;padding:0;justify-content:center}
.b svg{width:16px;height:16px;flex:none}
.b.warn{outline:2px solid var(--on);outline-offset:1px}
.seg{display:flex}
.seg .b{border-radius:0;margin-left:-1px}
.seg .b:first-child{border-radius:5px 0 0 5px;margin-left:0}
.seg .b:last-child{border-radius:0 5px 5px 0}
#profBtn .nm{max-width:16em;overflow:hidden;text-overflow:ellipsis}
select{height:28px;border:1px solid var(--line);border-radius:5px;background:var(--btn);padding:0 4px}
input[type=color]{width:28px;height:28px;padding:2px;border:1px solid var(--line);border-radius:5px;background:var(--btn);cursor:pointer}
input[type=range]{width:110px;accent-color:#333}
.num{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right;color:var(--muted)}
#pct{min-width:4.2em;font-weight:600;color:var(--text)}

/* viewer */
#viewer{position:relative;overflow:hidden;background:var(--view);touch-action:none;cursor:grab;user-select:none}
#viewer.dragging{cursor:grabbing}
.layer{position:absolute;top:0;bottom:0;overflow:hidden}
.mode-side #layA{left:0;right:calc(50% + 1px)}
.mode-side #layB{left:calc(50% + 1px);right:0}
.mode-side::after{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 1px);width:2px;background:#6c6c6c;pointer-events:none}
.mode-slider .layer,.mode-hold .layer{left:0;right:0}
.mode-hold.holding #layB{visibility:hidden}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage canvas{display:block}
#viewer.px canvas{image-rendering:pixelated}
#layB.empty canvas{visibility:hidden}
.tag{position:absolute;top:8px;padding:2px 7px;border-radius:3px;background:rgba(40,40,40,.72);color:#eee;font-size:12px;pointer-events:none}
#tagA{left:8px} #tagB{right:8px}
.mode-side #tagB{left:calc(50% + 9px);right:auto}
.mode-hold #tagA{display:none}
.mode-hold.holding #tagB::after{content:"元"}
.mode-hold:not(.holding) #tagB::after,.mode-side #tagB::after,.mode-slider #tagB::after{content:"印刷"}
#divider{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#f0f0f0;box-shadow:0 0 0 1px rgba(0,0,0,.35);display:none;cursor:ew-resize}
#divider::before{content:"";position:absolute;left:-12px;right:-12px;top:0;bottom:0}
#divider i{position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#f0f0f0;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#divider i::before,#divider i::after{content:"";position:absolute;top:8px;border:5px solid transparent}
#divider i::before{left:1px;border-right-color:#444}
#divider i::after{right:1px;border-left-color:#444}
.mode-slider #divider{display:block}
.noimg .tag,.noimg #divider,.noprof #divider,.noprof #tagB{display:none}

.notice{position:absolute;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#f2f2f2;text-align:center;cursor:default}
.notice svg{width:44px;height:44px;opacity:.85}
.notice .b{color:var(--text)}
#ntImage{inset:20px;border:2px dashed rgba(255,255,255,.55);border-radius:10px;cursor:pointer}
.noimg #ntImage{display:flex}
#viewer.over #ntImage{background:rgba(255,255,255,.08)}
#ntProfile{top:0;bottom:0;right:0;left:0;background:rgba(128,128,128,.82)}
.mode-side #ntProfile{left:calc(50% + 1px);background:none}
.noprof:not(.noimg) #ntProfile{display:flex}

#busy{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:7px;padding:4px 10px;border-radius:14px;background:rgba(30,30,30,.8);color:#eee;font-size:12px;pointer-events:none}
.mode-side #busy{left:75%}
#busy.on{display:flex}
#busy b{width:12px;height:12px;border:2px solid #aaa;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:min(560px,90%);padding:8px 14px;border-radius:6px;background:#f4f4f4;color:#111;box-shadow:0 2px 10px rgba(0,0,0,.35);display:none;z-index:5}
#toast.on{display:block}

/* status */
#status{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:4px 10px;min-height:28px;background:var(--bar);border-top:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums}
#probe{display:flex;align-items:center;gap:8px;min-height:18px}
#probe .sw{width:14px;height:14px;border:1px solid #777;border-radius:2px}
#probe .k{color:var(--muted)}
#info{margin-left:auto;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
#prog{width:90px;height:4px;background:#bbb;border-radius:2px;overflow:hidden;display:none}
#prog.on{display:block}
#prog i{display:block;height:100%;width:0;background:#333}
input[type=file]{display:none}
.b.mod{position:relative}
.b.mod::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:currentColor}
#adjPanel{position:absolute;top:8px;left:8px;z-index:4;display:none;width:260px;padding:8px 12px 10px;background:var(--bar);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:default}
#adjPanel.on{display:block}
#adjPanel .row{display:grid;grid-template-columns:5.2em 1fr 2.4em;align-items:center;gap:6px;margin:5px 0}
#adjPanel input[type=range]{width:100%}
#adjPanel .ft{display:flex;gap:6px;justify-content:space-between;margin-top:8px}
#adjPanel .hr{height:1px;background:var(--line);margin:10px -12px 8px}
#adjPanel .selhead{display:flex;align-items:center;gap:6px}
#adjPanel .selhead .grow{flex:1;color:var(--muted)}
#selSw{width:22px;height:22px;border:1px solid #777;border-radius:4px;background:repeating-linear-gradient(45deg,#ccc 0 4px,#e6e6e6 4px 8px)}
#adjPanel .row.off{opacity:.4;pointer-events:none}
#viewer.picking,#viewer.picking.dragging{cursor:crosshair}
</style>
</head>
<body>
<header id="bar">
  <div class="grp">
    <button class="b" id="imgBtn" title="画像を開く（PNG / JPEG / WebP）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>画像</button>
    <button class="b" id="profBtn" title="CMYK プロファイルを選ぶ（.icc / .icm）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/></svg><span class="nm">プロファイル未選択</span></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <select id="intent" title="レンダリングインテント">
      <option value="0">知覚的</option>
      <option value="1">相対的な色域を維持</option>
      <option value="2">彩度</option>
      <option value="3">絶対的な色域を維持</option>
    </select>
    <button class="b" id="bpc" aria-pressed="true" title="黒点の補正（Black Point Compensation）">黒点補正</button>
    <button class="b" id="paper" aria-pressed="false" title="紙の白を再現（紙の色・インキの黒をそのまま見せる）">紙の白</button>
  </div>
  <div class="sep"></div>
  <button class="b ic" id="adjBtn" aria-pressed="false" title="色の調整（調整した結果を「印刷」側で確かめる）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  <div class="sep"></div>
  <div class="grp seg" role="group" aria-label="比べ方">
    <button class="b ic" data-mode="side" title="左右に並べる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="8" height="14" rx="1"/><rect x="13" y="5" width="8" height="14" rx="1"/></svg></button>
    <button class="b ic" data-mode="slider" title="スライダーで比べる（左：元 / 右：印刷）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M12 3v18"/><path d="M12 5h9v14h-9z" fill="currentColor" opacity=".35"/></svg></button>
    <button class="b ic" data-mode="hold" title="押している間だけ元の画像"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.7-2.3L4.5 15a1.5 1.5 0 0 1 2.3-1.9L9 15.5"/></svg></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button class="b ic" id="gamut" aria-pressed="false" title="印刷で出せない色に印を付ける"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 2 20h20z"/><path d="M12 10v5M12 17.5v.5"/></svg></button>
    <input type="color" id="gcolor" value="#ff00ff" title="印の色">
    <input type="range" id="thr" min="0.5" max="20" step="0.5" value="5" title="色域外とみなす色の差（ΔE2000）">
    <span class="num" id="thrv">ΔE 5</span>
    <span class="num" id="pct" title="色域外の画素の割合">–</span>
  </div>
  <div class="sp"></div>
  <div class="grp">
    <button class="b ic" id="fitBtn" title="全体を表示（ダブルクリックでも）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    <button class="b" id="oneBtn" title="等倍で表示">1:1</button>
    <span class="num" id="zoomv">–</span>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button class="b ic" id="saveBtn" title="印刷後の見た目を PNG で保存" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v11m-5-5 5 5 5-5M4 19h16"/></svg></button>
    <button class="b ic" id="saveGBtn" title="色域外の印を重ねて PNG で保存" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 4v9m-4-4 4 4 4-4M3 19h9"/><path d="m18 12-4 7h8z"/></svg></button>
  </div>
  <input type="file" id="imgFile" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp">
  <input type="file" id="profFile" accept=".icc,.icm,application/vnd.iccprofile">
</header>

<main id="viewer" class="mode-side noimg noprof">
  <div class="layer" id="layA"><div class="stage"><canvas id="cvA" width="1" height="1"></canvas></div></div>
  <div class="layer empty" id="layB"><div class="stage"><canvas id="cvB" width="1" height="1"></canvas></div></div>
  <span class="tag" id="tagA">元</span><span class="tag" id="tagB"></span>
  <div id="divider"><i></i></div>
  <div class="notice" id="ntImage">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>
    <div>画像をドロップ／クリックして選択</div>
  </div>
  <div class="notice" id="ntProfile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/></svg>
    <div>CMYK プロファイルを選んでください</div>
    <button class="b" id="ntProfBtn">.icc / .icm を選ぶ</button>
  </div>
  <div id="adjPanel">
    <div class="row"><span>明るさ</span><input type="range" data-adj="bright" min="-50" max="50" step="1" value="0"><span class="num"></span></div>
    <div class="row"><span>コントラスト</span><input type="range" data-adj="contrast" min="-50" max="50" step="1" value="0"><span class="num"></span></div>
    <div class="row"><span>彩度</span><input type="range" data-adj="sat" min="-50" max="50" step="1" value="0"><span class="num"></span></div>
    <div class="row"><span>暖かさ</span><input type="range" data-adj="temp" min="-50" max="50" step="1" value="0"><span class="num"></span></div>
    <div class="hr"></div>
    <div class="selhead">
      <button class="b ic" id="selPick" aria-pressed="false" title="直したい色を画像からクリックして選ぶ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m14 7 3 3M5 19l1-4 9-9a2.1 2.1 0 0 1 3 3l-9 9z"/></svg></button>
      <span id="selSw"></span>
      <span class="grow" id="selTxt">狙った色だけ</span>
      <button class="b ic" id="selShow" aria-pressed="false" title="影響する範囲を表示" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
      <button class="b ic" id="selClear" title="部分調整をやめる" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="row sel"><span>範囲</span><input type="range" data-sel="range" min="5" max="100" step="1" value="30"><span class="num"></span></div>
    <div class="row sel"><span>色相</span><input type="range" data-sel="hue" min="-60" max="60" step="1" value="0"><span class="num"></span></div>
    <div class="row sel"><span>彩度</span><input type="range" data-sel="sat" min="-50" max="50" step="1" value="0"><span class="num"></span></div>
    <div class="row sel"><span>明るさ</span><input type="range" data-sel="light" min="-50" max="50" step="1" value="0"><span class="num"></span></div>
    <div class="ft">
      <button class="b" id="adjReset" title="調整を元に戻す">リセット</button>
      <button class="b" id="adjSave" title="調整した画像を PNG で保存（印刷に使う画像）" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v11m-5-5 5 5 5-5M4 19h16"/></svg>調整した画像</button>
    </div>
  </div>
  <div id="busy"><b></b><span id="busyT">変換中</span></div>
  <div id="toast"></div>
</main>

<footer id="status">
  <div id="probe"></div>
  <div id="prog"><i></i></div>
  <div id="info"></div>

    const hd = header(bytes);

function onImage({ w, h, buf, icc }) {

async function onRender({ id, intent, bpc, paper, adj }) {

  let t1 = 0, t2 = 0, t3 = 0, t4 = 0, pin = 0, pc = 0, pl1 = 0, pl2 = 0, pr = 0;
  try {
    t1 = m.cmsCreateTransform(hSrc, TYPE_RGBA_8, hCmyk, TYPE_CMYK_16, intent, f);
    t2 = m.cmsCreateTransform(hSrc, TYPE_RGBA_8, hLab, TYPE_Lab_16, REL, 0);
    t3 = m.cmsCreateTransform(hCmyk, TYPE_CMYK_16, hLab, TYPE_Lab_16, REL, f);
    t4 = paper ? m.cmsCreateTransform(hCmyk, TYPE_CMYK_16, hSRGB, TYPE_RGB_8, ABS, 0)

    if (!t1 || !t2 || !t3 || !t4) throw new Error('この設定では変換できません');

const queue = [];
let running = false;
port.onmessage = async ({ data }) => {
  if (data.type === 'render' || data.type === 'image') gen++;
  queue.push(data);
  if (running) return;
  running = true;
  while (queue.length) {
    const d = queue.shift();
    try {
      await ensure();
      if (d.type === 'profile') onProfile(d);
      else if (d.type === 'exportAdj') onExportAdj(d);
      else if (d.type === 'image') onImage(d);

  e => post({ type: 'fatal', message: errMsg(e) }));

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const viewer = $('#viewer'), layA = $('#layA'), layB = $('#layB');
const cvA = $('#cvA'), cvB = $('#cvB'), stages = [...document.querySelectorAll('.stage')];
const ctxA = cvA.getContext('2d'), ctxB = cvB.getContext('2d');

const DEF = { intent: 1, bpc: true, paper: false, mode: 'side', gamut: false, gcolor: '#ff00ff', thr: 5, split: 0.5 };

/* ---------- toast / busy ---------- */

}

/* ---------- worker ---------- */

}

}

function onWorker({ data: d }) {
  switch (d.type) {
    case 'ready':

      break;

      break;

      pendingProf = null;

        if (!pp.stored) idbSet('cmyk', { name: pp.name, bytes: pp.bytes });
        if (!d.printer) toast('このプロファイルはプリンター用（出力用）ではないようです。結果は目安にしてください。');
        updateUI(); render();
      } else if (pp.stored) {
        idbDel('cmyk');
      } else {
        toast(`読み込めません：${d.message}`);
      }
      break;
    }
    case 'image':
      if (!img) return;
      if (d.orig && d.orig.byteLength === img.w * img.h * 4) ctxA.putImageData(new ImageData(new Uint8ClampedArray(d.orig), img.w, img.h), 0, 0);
      img.src = d.srcDesc + (d.embedded ? '（埋め込み）' : '');
      if (d.note) toast(d.note);
      updateInfo();
      break;
    case 'adjusted':
      if (img && d.buf.byteLength === img.w * img.h * 4)
        download(new ImageData(new Uint8ClampedArray(d.buf), img.w, img.h), '_adjusted');
      break;

    case 'result':
      if (d.id !== rid) return;
      result = { out: new Uint8ClampedArray(d.out), cm: new Uint8Array(d.cm), de: new Uint16Array(d.de),

      busy(false); compose(); updateUI();
      break;
    case 'error':
      if (d.id != null && d.id !== rid) return;
      busy(false); toast(d.message);

function render() {
  if (!ready || !img || !profile) return;
  rid++;
  busy(true, 0);
  worker.postMessage({ type: 'render', id: rid, intent: +S.intent, bpc: S.bpc, paper: S.paper, adj });

let renderTimer = 0;
function renderSoon() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 120); }
function sendImage() {
  const copy = img.data.slice();
  worker.postMessage({ type: 'image', w: img.w, h: img.h, buf: copy.buffer, icc: img.icc }, [copy.buffer]);
}
function sendProfile(bytes, name, stored) {
  pendingProf = { tag: ++ptag, bytes, name, stored };
  worker.postMessage({ type: 'profile', tag: ptag, bytes: bytes.slice() });
}

/* ---------- IndexedDB ---------- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('softproof', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}

    const db = await idb();

      const q = fn(db.transaction('kv', mode).objectStore('kv'));
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);

}

const idbSet = (k, v) => idbOp('readwrite', s => s.put(v, k));
const idbDel = k => idbOp('readwrite', s => s.delete(k));

  if (profile || pendingProf) return;

/* ---------- embedded ICC ---------- */

/* ---------- loading ---------- */
const isProfileFile = f => /\.(icc|icm)$/i.test(f.name) || f.type === 'application/vnd.iccprofile';

  for (const cv of [cvA, cvB]) { cv.width = w; cv.height = h; }

async function loadProfile(file) {

  view.s = Math.min((r.width - pad * 2) / img.w, (r.height - pad * 2) / img.h);
  view.x = (r.width - img.w * view.s) / 2;
  view.y = (r.height - img.h * view.s) / 2;
  view.fit = true;
  applyView();
}
function zoomAt(lx, ly, s) {
  s = Math.min(64, Math.max(0.01, s));
  view.x = lx - (lx - view.x) * s / view.s;
  view.y = ly - (ly - view.y) * s / view.s;
  view.s = s; view.fit = false;
  applyView();
}
function local(e) {
  let lay = viewer;
  if (S.mode === 'side') lay = e.clientX >= layB.getBoundingClientRect().left ? layB : layA;
  const r = lay.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function applySplit() {
  const w = viewer.clientWidth, x = Math.round(S.split * w);
  $('#divider').style.left = `${x}px`;
  layB.style.clipPath = S.mode === 'slider' ? `inset(0 0 0 ${x}px)` : '';
}

viewer.addEventListener('wheel', e => {
  if (!img || e.target.closest('#adjPanel')) return;
  e.preventDefault();
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  const [lx, ly] = local(e);
  zoomAt(lx, ly, view.s * Math.exp(-dy * 0.0015));
}, { passive: false });

let drag = null;
viewer.addEventListener('pointerdown', e => {
  if (!img || e.button !== 0 || e.target.closest('.notice, #divider, #toast, #adjPanel')) return;
  if (picking) { pickAt(e); return; }
  drag = { x: e.clientX, y: e.clientY };
  viewer.setPointerCapture(e.pointerId);
  viewer.classList.add('dragging');
  if (S.mode === 'hold') viewer.classList.add('holding');
});
viewer.addEventListener('pointermove', e => {
  if (drag) {
    view.x += e.clientX - drag.x; view.y += e.clientY - drag.y; view.fit = false;
    drag.x = e.clientX; drag.y = e.clientY;
    applyView();
  }
  probe(e);
});
const endDrag = () => { drag = null; viewer.classList.remove('dragging', 'holding'); };
viewer.addEventListener('pointerup', endDrag);
viewer.addEventListener('pointercancel', endDrag);
viewer.addEventListener('pointerleave', () => { if (!drag) $('#probe').innerHTML = ''; });
viewer.addEventListener('dblclick', e => { if (img && !e.target.closest('.notice, #adjPanel')) fit(); });

const divider = $('#divider');
divider.addEventListener('pointerdown', e => {
  e.stopPropagation();
  divider.setPointerCapture(e.pointerId);
  const move = ev => {
    const r = viewer.getBoundingClientRect();
    S.split = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    applySplit();
  };
  const up = () => { divider.removeEventListener('pointermove', move); divider.removeEventListener('pointerup', up); save(); };
  divider.addEventListener('pointermove', move);
  divider.addEventListener('pointerup', up);
});

/* ---------- selective colour ---------- */
function pixelAt(e) {
  const [lx, ly] = local(e);
  const ix = Math.floor((lx - view.x) / view.s), iy = Math.floor((ly - view.y) / view.s);
  return ix < 0 || iy < 0 || ix >= img.w || iy >= img.h ? -1 : iy * img.w + ix;
}
function pickAt(e) {
  const i = pixelAt(e);
  if (i < 0) return;
  const o = img.data, q = i * 4;
  adj.sel = { rgb: [o[q], o[q + 1], o[q + 2]], ...selVals };
  picking = false;
  updateUI(); render();
}

/* ---------- eyedropper ---------- */
const sw = (r, g, b) => `<span class="sw" style="background:rgb(${r},${g},${b})"></span>`;
function probe(e) {
  const el = $('#probe');
  if (!img || e.target.closest('.notice, #adjPanel')) { el.innerHTML = ''; return; }
  const [lx, ly] = local(e);
  const ix = Math.floor((lx - view.x) / view.s), iy = Math.floor((ly - view.y) / view.s);
  if (ix < 0 || iy < 0 || ix >= img.w || iy >= img.h) { el.innerHTML = ''; return; }
  const i = iy * img.w + ix, q = i * 4, o = img.data;
  let h = `<span class="k">${ix}, ${iy}</span>${sw(o[q], o[q + 1], o[q + 2])}<span><span class="k">RGB</span> ${o[q]} ${o[q + 1]} ${o[q + 2]}</span>`;
  if (result) {
    const c = result.cm, p = result.out, pc = v => Math.round(v / 2.55);
    const d = result.de[i] / 100;
    h += `<span><span class="k">CMYK</span> ${pc(c[q])} ${pc(c[q + 1])} ${pc(c[q + 2])} ${pc(c[q + 3])} %</span>`
       + `<span class="k">→</span>${sw(p[q], p[q + 1], p[q + 2])}<span><span class="k">RGB</span> ${p[q]} ${p[q + 1]} ${p[q + 2]}</span>`
       + `<span${d > S.thr ? ' style="font-weight:700"' : ''}><span class="k">ΔE</span> ${d.toFixed(1)}</span>`;
  }
  el.innerHTML = h;
}

/* ---------- UI state ---------- */
function updateInfo() {
  $('#info').textContent = img ? `${img.w}×${img.h}　入力: ${img.src}` + (profile ? `　出力: ${profile.desc}` : '') : '';
}
function updateUI() {
  viewer.className = viewer.className.replace(/\bmode-\w+/g, '').trim() + ` mode-${S.mode}`;
  viewer.classList.toggle('noimg', !img);
  viewer.classList.toggle('noprof', !profile);
  layB.classList.toggle('empty', !result);
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.mode));
  $('#intent').value = S.intent;
  $('#bpc').setAttribute('aria-pressed', S.bpc);
  $('#paper').setAttribute('aria-pressed', S.paper);
  $('#gamut').setAttribute('aria-pressed', S.gamut);
  $('#gcolor').value = S.gcolor;
  $('#thr').value = S.thr;
  $('#thrv').textContent = `ΔE ${(+S.thr).toFixed(1).replace(/\.0$/, '')}`;
  const pb = $('#profBtn');
  pb.querySelector('.nm').textContent = profile ? profile.desc : 'プロファイル未選択';
  pb.title = profile ? `CMYK プロファイル：${profile.desc}（${profile.name}）\nクリックで変更` : 'CMYK プロファイルを選ぶ（.icc / .icm）';
  pb.classList.toggle('warn', !profile && !!img);
  $('#saveBtn').disabled = $('#saveGBtn').disabled = !result;
  $('#adjSave').disabled = !img || !ready;
  document.querySelectorAll('[data-adj]').forEach(r => {
    r.value = adj[r.dataset.adj];
    const v = adj[r.dataset.adj];
    r.nextElementSibling.textContent = v > 0 ? `+${v}` : v;
  });
  $('#adjBtn').classList.toggle('mod', Object.keys(ADJ0).some(k => adj[k]));
  document.querySelectorAll('[data-sel]').forEach(r => {
    const v = selVals[r.dataset.sel];
    r.value = v;
    r.nextElementSibling.textContent = r.dataset.sel === 'range' ? v : v > 0 ? `+${v}` : v;
    r.closest('.row').classList.toggle('off', !adj.sel);
  });
  viewer.classList.toggle('picking', picking);
  $('#selPick').setAttribute('aria-pressed', picking);
  $('#selPick').disabled = !img;
  $('#selShow').setAttribute('aria-pressed', showSel);
  $('#selShow').disabled = $('#selClear').disabled = !adj.sel;
  const c = adj.sel && adj.sel.rgb;
  $('#selSw').style.background = c ? `rgb(${c})` : '';
  $('#selTxt').textContent = picking ? '画像をクリック' : c ? `RGB ${c.join(' ')}` : '狙った色だけ';
  if (!result) $('#pct').textContent = '–';
  applySplit(); updateInfo();
}

/* ---------- controls ---------- */
$('#imgBtn').onclick = () => $('#imgFile').click();
$('#ntImage').onclick = () => $('#imgFile').click();
$('#profBtn').onclick = $('#ntProfBtn').onclick = () => $('#profFile').click();
$('#imgFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadImage(f); };
$('#profFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadProfile(f); };
$('#intent').onchange = e => { S.intent = +e.target.value; save(); render(); };
$('#bpc').onclick = () => { S.bpc = !S.bpc; save(); updateUI(); render(); };
$('#paper').onclick = () => { S.paper = !S.paper; save(); updateUI(); render(); };
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  S.mode = b.dataset.mode; save(); updateUI();
  if (view.fit) fit();
});
$('#adjBtn').onclick = () => {
  const on = $('#adjPanel').classList.toggle('on');
  $('#adjBtn').setAttribute('aria-pressed', on);
};
document.querySelectorAll('[data-adj]').forEach(r => {
  r.oninput = () => { adj[r.dataset.adj] = +r.value; updateUI(); renderSoon(); };
  r.ondblclick = () => { adj[r.dataset.adj] = 0; updateUI(); renderSoon(); };
});
$('#adjReset').onclick = () => { adj = { ...ADJ0 }; selVals = { ...SEL0 }; showSel = false; updateUI(); render(); };
$('#selPick').onclick = () => { picking = !picking; updateUI(); };
$('#selShow').onclick = () => { showSel = !showSel; updateUI(); compose(); };
$('#selClear').onclick = () => { adj.sel = null; showSel = false; updateUI(); render(); };
document.querySelectorAll('[data-sel]').forEach(r => {
  const set = v => { selVals[r.dataset.sel] = v; if (adj.sel) adj.sel = { ...adj.sel, ...selVals }; updateUI(); renderSoon(); };
  r.oninput = () => set(+r.value);
  r.ondblclick = () => set(SEL0[r.dataset.sel]);
});
$('#adjSave').onclick = () => { if (img && ready) worker.postMessage({ type: 'exportAdj', id: 0, adj }); };
$('#gamut').onclick = () => { S.gamut = !S.gamut; save(); updateUI(); compose(); };
$('#gcolor').oninput = e => { S.gcolor = e.target.value; save(); compose(); };
$('#thr').oninput = e => { S.thr = +e.target.value; save(); updateUI(); compose(); };
$('#fitBtn').onclick = fit;
$('#oneBtn').onclick = () => { if (!img) return; const r = layerRect(); zoomAt(r.width / 2, r.height / 2, 1); };
$('#saveBtn').onclick = () => exportPNG(false);
$('#saveGBtn').onclick = () => exportPNG(true);
window.addEventListener('resize', () => { if (view.fit) fit(); applySplit(); });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && picking) { picking = false; updateUI(); return; }
  if (e.target.closest('input, select')) return;
  if (e.key === '0') fit();
  else if (e.key === '1') $('#oneBtn').click();
});

['dragenter', 'dragover'].forEach(t => window.addEventListener(t, e => { e.preventDefault(); viewer.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => window.addEventListener(t, e => { e.preventDefault(); viewer.classList.remove('over'); }));
window.addEventListener('drop', e => {
  for (const f of e.dataTransfer.files) {
    if (isProfileFile(f)) loadProfile(f);
    else loadImage(f);
  }
});

updateUI(); applyView();
startWorker();
})();
</script>
</body>
</html>
